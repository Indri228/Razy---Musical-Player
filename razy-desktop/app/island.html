<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Razy — остров</title>
<style>
:root{--a:#8b5cf6;--b:#d946ef;--g:linear-gradient(135deg,var(--a),var(--b));--mu:#ffffff9e;--ease:cubic-bezier(.32,1.28,.44,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{width:440px;height:200px;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}

/* сам «остров»: чёрная таблетка по центру сверху, при наведении плавно раскрывается */
#isl{position:absolute;left:50%;top:8px;width:240px;height:36px;margin-left:-120px;border-radius:18px;background:#000;border:1px solid #ffffff12;overflow:hidden;
  box-shadow:0 10px 24px -8px #000c;
  transition:width .55s var(--ease),height .55s var(--ease),margin-left .55s var(--ease),border-radius .55s var(--ease),background .4s;
  animation:drop .6s var(--ease)}
@keyframes drop{from{transform:translateY(-46px) scale(.8);opacity:0}to{transform:none;opacity:1}}
#isl.open{width:380px;height:162px;margin-left:-190px;border-radius:36px}
body.color #isl{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 64%,#07040f),color-mix(in srgb,var(--b) 54%,#07040f));border-color:#ffffff2e}

/* свёрнутый вид: только название трека */
.cm{position:absolute;left:50%;top:0;width:238px;height:34px;margin-left:-119px;display:flex;align-items:center;gap:9px;padding:0 17px;transition:opacity .22s,filter .22s,transform .3s}
#isl.open .cm{opacity:0;filter:blur(6px);transform:scale(.9);pointer-events:none}
#eq{width:16px;height:14px;flex:none}
.tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;position:relative}
.tt span{display:inline-block;padding-right:36px}
.tt.mq{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.tt.mq span{animation:mq 10s linear infinite}
@keyframes mq{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--sh))}}
.cm .tt{font-size:13px;font-weight:600;line-height:34px;letter-spacing:.1px}

/* раскрытый вид */
.cf{position:absolute;left:50%;top:0;width:380px;height:162px;margin-left:-190px;padding:17px 20px 14px;display:flex;flex-direction:column;justify-content:space-between;
  opacity:0;filter:blur(8px);transform:scale(.9);transform-origin:50% 0;pointer-events:none;transition:opacity .2s,filter .2s,transform .25s}
#isl.open .cf{opacity:1;filter:none;transform:none;pointer-events:auto;transition:opacity .3s .14s,filter .3s .14s,transform .45s .1s var(--ease)}
.r1{display:flex;align-items:center;gap:13px;height:58px}
.art{position:relative;width:58px;height:58px;flex:none;border-radius:17px;cursor:pointer;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--a) 70%,transparent),0 0 0 1px #ffffff1c}
.art i{position:absolute;inset:0;border-radius:inherit;background:var(--g) center/cover;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px;color:#ffffffd9}
.tx{flex:1;min-width:0}
.tx .tt{font-size:15.5px;font-weight:750;line-height:21px}
.ar{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#vz{width:64px;height:30px;flex:none}
.r2{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.r2 span{width:30px}.r2 span:last-child{text-align:right}
.pg{flex:1;height:16px;cursor:pointer;position:relative}
.pg i{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:4px;background:#ffffff26;overflow:hidden;transition:height .15s,top .15s}
.pg:hover i{height:6px;top:5px}
.pg b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:4px}
body:not(.color) .pg b{background:var(--g)}
.r3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.r3 .l{justify-self:start}.r3 .rr{justify-self:end}
.m{display:flex;align-items:center;gap:10px}
button{border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:50%;transition:background .15s,transform .15s,opacity .15s}
button svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.m button{width:38px;height:38px}
.m button:hover{background:#ffffff1f}.m button:active{transform:scale(.88)}
.m .pp{width:44px;height:44px;background:#fff;color:#000}
.m .pp:hover{background:#fff;transform:scale(1.07)}
.m .pp svg{width:20px;height:20px}
.sm{width:28px;height:28px;color:var(--mu)}.sm:hover{background:#ffffff1f;color:#fff}
.sm svg{width:15px;height:15px;fill:none}
body.eco *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="isl">
  <div class="cm"><canvas id="eq"></canvas><div class="tt" id="tt1"><span id="t1">Ничего не играет</span></div></div>
  <div class="cf">
    <div class="r1">
      <div class="art" id="av" title="Открыть Razy"><i id="cover">♪</i></div>
      <div class="tx"><div class="tt" id="tt2"><span id="t2">Ничего не играет</span></div><div class="ar" id="ar"></div></div>
      <canvas id="vz"></canvas>
    </div>
    <div class="r2"><span id="tc">0:00</span><div class="pg" id="pg"><i><b id="pb"></b></i></div><span id="td">0:00</span></div>
    <div class="r3">
      <div class="l"><button id="set" class="sm" title="Настройки мини-плеера"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
      <div class="m">
        <button id="prev" title="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M18 5L8 12l10 7z"/><path d="M5 5v14" fill="none"/></svg></button>
        <button id="pp" class="pp" title="Пауза / играть"><svg viewBox="0 0 24 24" id="ppi"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button id="next" title="Следующий трек"><svg viewBox="0 0 24 24"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14" fill="none"/></svg></button>
      </div>
      <div class="rr"><button id="x" class="sm" title="Закрыть остров"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const B=window.razyMiniWin||{cmd(){},onState(){},onViz(){},onCfg(){},onHover(){}};
const PLAY='<path d="M7 4.5v15l13-7.5z"/>',PAUSE='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
let st={title:'',artist:'',playing:false,pos:0,dur:0},cfg={viz:true,theme:'black'},bins=new Uint8Array(64),at=performance.now(),eco=false,open=false;
const isl=$('#isl'),DPR=Math.max(1,Math.min(2,devicePixelRatio||1));

/* визуализатор: 4 столбика в свёрнутом виде и 14 в раскрытом */
function mk(cv,w,h){cv.width=w*DPR;cv.height=h*DPR;const g=cv.getContext('2d');g.scale(DPR,DPR);return g}
const eq=mk($('#eq'),16,14),vz=mk($('#vz'),64,30),smE=new Float32Array(4),smV=new Float32Array(14);
function bars(g,w,h,n,gap,sm,idx,on,solid){
  g.clearRect(0,0,w,h);
  const bw=(w-gap*(n-1))/n,cs=getComputedStyle(document.documentElement);
  let fill;if(solid)fill='#fff';else{fill=g.createLinearGradient(0,0,w,0);fill.addColorStop(0,cs.getPropertyValue('--a'));fill.addColorStop(1,cs.getPropertyValue('--b'))}
  g.fillStyle=fill;g.globalAlpha=on?.95:.4;
  for(let i=0;i<n;i++){
    const t=on?Math.min(1,bins[idx(i)]/255*1.2):0;sm[i]+=(t-sm[i])*.38;
    const bh=Math.max(2.5,sm[i]*h),x=i*(bw+gap),y=(h-bh)/2;
    g.beginPath();g.roundRect(x,y,bw,bh,Math.min(bw/2,2));g.fill();
  }
  g.globalAlpha=1;
}
const solid=()=>document.body.classList.contains('color');
function draw(){
  const on=!!cfg.viz&&!eco&&st.playing;
  if(!open)bars(eq,16,14,4,2.2,smE,i=>[1,5,11,20][i],on,solid());
  else bars(vz,64,30,14,3,smV,i=>Math.round(1+i*2.6),on,solid());
}

/* время */
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* бегущая строка, если название не помещается */
function marquee(box,txt){
  box.classList.remove('mq');
  requestAnimationFrame(()=>{if(!box.clientWidth)return;const over=txt.offsetWidth-box.clientWidth;if(over>0&&!eco){box.style.setProperty('--sh','-'+txt.offsetWidth+'px');box.classList.add('mq')}});
}
function paint(){
  document.body.classList.toggle('color',cfg.theme==='color');
  document.body.classList.toggle('eco',!!eco);
  $('#ppi').innerHTML=st.playing?PAUSE:PLAY;
  $('#ar').textContent=st.artist||'';
  const ttl=st.title||'Ничего не играет';
  $('#t1').textContent=ttl;$('#t2').textContent=ttl;
  marquee($('#tt1'),$('#t1'));marquee($('#tt2'),$('#t2'));
}
function cover(){
  const c=$('#cover');
  if(st.art){c.style.background="url('"+String(st.art).replace(/'/g,"%27")+"') center/cover";c.textContent=''}
  else{c.style.background=st.bg||'';c.textContent=st.title?(st.title[0]||'♪').toUpperCase():'♪'}
}
function setOpen(v){
  v=!!v;if(v===open)return;open=v;isl.classList.toggle('open',v);
  // название в раскрытом виде измеряется уже после анимации ширины
  if(v)setTimeout(()=>marquee($('#tt2'),$('#t2')),600);
}
B.onState(s=>{
  if(!s)return;const keyChanged=('k' in s)&&s.k!==st.k;
  st=Object.assign(st,s);at=performance.now();
  if(s.a)document.documentElement.style.setProperty('--a',s.a);if(s.b)document.documentElement.style.setProperty('--b',s.b);
  if('eco' in s)eco=!!s.eco;
  if(keyChanged||'art' in s||'bg' in s)cover();
  paint();
});
B.onCfg(c=>{cfg=Object.assign(cfg,c||{});paint()});
B.onViz(a=>{if(a&&a.length)bins=a});
// наведение определяет главный процесс (по положению курсора), поэтому остров не «залипает» и не перехватывает клики вокруг
B.onHover(setOpen);
// запасной вариант, если окно открыто просто в браузере (без Electron)
if(!window.razyMiniWin){isl.addEventListener('mouseenter',()=>setOpen(true));isl.addEventListener('mouseleave',()=>setOpen(false))}

$('#pp').onclick=()=>B.cmd('toggle');$('#next').onclick=()=>B.cmd('next');$('#prev').onclick=()=>B.cmd('prev');
$('#x').onclick=()=>B.cmd('close');$('#set').onclick=()=>B.cmd('settings');$('#av').onclick=()=>B.cmd('open');
$('#pg').onclick=e=>{const r=$('#pg').getBoundingClientRect();B.cmd({seek:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))})};

let tick=0;
function loop(){
  const pos=st.pos+(st.playing?(performance.now()-at)/1000:0),p=st.dur?Math.min(1,pos/st.dur):0;
  if(open){$('#pb').style.width=(p*100).toFixed(2)+'%';if(!(tick++%8)){$('#tc').textContent=fmt(pos);$('#td').textContent=st.dur?fmt(st.dur):'–:––'}}
  draw();
  setTimeout(()=>requestAnimationFrame(loop),st.playing&&cfg.viz&&!eco?33:200);
}
paint();cover();loop();
</script>
</body>
</html>

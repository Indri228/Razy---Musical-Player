name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Razy for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract supplied Razy project archive
        run: |
          test -f Razy-Android-GitHub-Ready.zip || { echo "Upload Razy-Android-GitHub-Ready.zip to the repository root first."; exit 1; }
          unzip -q Razy-Android-GitHub-Ready.zip -d .
          test -f razy-desktop/mobile/package.json
          test -f razy-desktop/main.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: razy-desktop/mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure shared Razy server (optional)
        if: ${{ vars.RAZY_SERVER_URL != '' }}
        run: |
          node -e "const fs=require('fs');const p='razy-desktop/config.json';const c=require('./'+p);c.server=process.env.SRV;fs.writeFileSync(p,JSON.stringify(c,null,2))"
        env:
          SRV: ${{ vars.RAZY_SERVER_URL }}

      - name: Install Android wrapper dependencies
        working-directory: razy-desktop/mobile
        run: npm install

      - name: Build web app
        working-directory: razy-desktop/mobile
        run: node scripts/build-www.js

      - name: Generate Android project
        working-directory: razy-desktop/mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icons
        working-directory: razy-desktop/mobile
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0716' --iconBackgroundColorDark '#0b0716'

      - name: Install native music library plugin
        working-directory: razy-desktop/mobile
        shell: bash
        run: |
          set -euo pipefail
          d=android/app/src/main/java/app/razy/player
          mkdir -p "$d"
          cp native/DeviceMusicPlugin.java native/MainActivity.java "$d/"
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'READ_MEDIA_AUDIO' "$f" || sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application#' "$f"
          grep -q 'usesCleartextTraffic' "$f" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$f"

      - name: Build debug APK
        working-directory: razy-desktop/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Razy-Android
          path: razy-desktop/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
